name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
      - run: go vet ./...
      - name: Build for every supported GOOS
        run: |
          for os in linux darwin freebsd; do GOOS=$os go build ./...; done
      - run: go test ./...
      - name: Cross-compile and check size
        run: |
          ./build.sh ci
          test "$(stat -c %s dist/sixup-ci-linux-x86_64)" -le 6291456

  integration:
    # The unit tests cover the logic; these cover the kernel accepting it. Coverage counts both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      # The peers of the interoperability tests; dnsmasq-base and dhcpcd-base start no service.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsmasq-base radvd kea-dhcp6-server dhcpcd-base
      - run: sudo -E env "PATH=$PATH" go test -tags integration -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      # Built from source with the repo's Go toolchain: the prebuilt binaries lag
      # behind the Go version in go.mod and refuse to load the config.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: golangci-lint run

  image:
    # The release workflow builds the image only on a tag; this keeps the Dockerfile honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false

  # Every push to main that passes the checks above replaces the dev pre-release.
  # A fixed version keeps the download URLs stable; the packages still carry the commit
  # time in their version, so package managers see each build as newer.
  dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, integration, lint, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: ./build.sh dev
      - name: Replace the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" --title dev \
            --notes "Built from $GITHUB_SHA on main. Untested, and options may change from one build to the next; use a v* release for anything that matters."
