name: ISP or line type not recognised
description: A line whose prefix, tunnel or MAP-E parameters sixup does not work out
labels: [isp-support]
body:
  - type: markdown
    attributes:
      value: |
        The MAP-E rule tables and the tunnel heuristics grow from lines people actually measured,
        so a good report here helps everyone on the same ISP. Nothing but `-dry-run` is needed.
  - type: input
    id: isp
    attributes:
      label: ISP, country and line type
      description: "For example: OCN バーチャルコネクト, Japan, NTT フレッツ光 IPoE; or China Mobile, PPPoE."
    validations: { required: true }
  - type: textarea
    id: dryrun
    attributes:
      label: Output of -dry-run
      description: "`sudo sixup -wan YOUR_WAN_IF -dry-run`. Let it run at least a minute so the tunnel capture has something to work with."
      render: text
    validations: { required: true }
  - type: textarea
    id: working
    attributes:
      label: What configuration does work on this line
      description: "The odhcp6c/map.sh/ds-lite script, HGW settings or vendor router values that are known good: BR or AFTR address, port ranges, MTU."
  - type: checkboxes
    id: consent
    attributes:
      label: Data
      options:
        - label: I understand the report is public and I have masked what I want to keep private
          required: true
