name: Bug report
description: sixup does not work on your line
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what happened instead, and your ISP and line type.
    validations: { required: true }
  - type: textarea
    id: dryrun
    attributes:
      label: Output of -dry-run
      description: "`sudo sixup -wan YOUR_WAN_IF -dry-run`, left running for a minute. It changes nothing on the system. Mask what you want to keep private."
      render: text
